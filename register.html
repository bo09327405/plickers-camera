<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>學生人臉註冊</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#E4E7EC; --paper:#F6F7F9; --ink:#1C2230; --ink-2:#5A6273; --line:#C9CED8;
  --spike:#FF3D7F; --ontime:#14A06A; --late:#E5A000; --absent:#D6403A;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--spike);outline-offset:2px}

.wrap{max-width:480px;margin:0 auto;padding:calc(24px + var(--safe-t)) 18px calc(40px + var(--safe-b));display:flex;flex-direction:column;gap:18px;min-height:100%}
.brand{display:flex;align-items:flex-end;gap:12px;margin-bottom:2px}
.brand h1{margin:0;font-size:30px;font-weight:900;position:relative;padding-bottom:8px;z-index:0;isolation:isolate}
.brand h1::after{content:"";position:absolute;left:-4px;right:-6px;bottom:0;height:9px;background:var(--spike);transform:rotate(-1.6deg);z-index:-1;border-radius:1px;clip-path:polygon(0 12%,100% 0,99% 88%,1% 100%)}
.brand p{margin:0 0 8px;color:var(--ink-2);font-size:13px}
.whoami{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-2);background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 14px}
.whoami button{appearance:none;border:0;background:var(--wall);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink)}

.card{background:var(--paper);border-radius:12px;padding:22px 20px;box-shadow:0 10px 30px rgba(28,34,48,.08);display:flex;flex-direction:column;gap:16px}
.card h2{margin:0;font-size:19px}
.hint{font-size:13px;color:var(--ink-2);margin:0}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:13px;font-weight:700}
.inp{height:48px;border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:0 12px;width:100%;font-size:16px}
select.inp{font-size:15px}

.classes{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.cls{appearance:none;border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:8px 8px 6px;text-align:left;cursor:pointer;display:flex;flex-direction:column;line-height:1.1}
.cls b{font-family:"Big Shoulders Display","Noto Sans TC",sans-serif;font-size:26px;font-weight:700}
.cls span{font-size:11px;color:var(--ink-2);margin-top:3px}
.cls[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.cls[aria-pressed="true"] span{color:#C9CED8}

.whocard{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:14px;font-size:15px;font-weight:700}
.reregwarn{border:1.5px solid var(--late);background:#FFF7E6;border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}

.consentbox{max-height:260px;overflow:auto;border:1.5px solid var(--line);border-radius:8px;padding:14px;font-size:13px;color:var(--ink-2);white-space:pre-wrap;background:#fff}
.agreerow{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.agreerow input{margin-top:3px;flex:none;width:18px;height:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.cam{position:relative;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.cam.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:flashfx .35s ease-out forwards;pointer-events:none}
@keyframes flashfx{from{opacity:.85}to{opacity:0}}
.camguide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.camguide ellipse{fill:none;stroke:rgba(255,255,255,.6);stroke-width:1.6;stroke-dasharray:5 4;transition:stroke .15s,stroke-width .15s}
.cam.guide-ok .camguide ellipse{stroke:var(--ontime);stroke-dasharray:none;stroke-width:2.4}
.cam.guide-bad .camguide ellipse{stroke:var(--absent);stroke-dasharray:none;stroke-width:2.4}
.dots{display:flex;gap:7px;justify-content:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block;transition:background .2s,transform .2s}
.dots i.on{background:var(--ontime);transform:scale(1.15)}

.acts{display:flex;flex-direction:column;gap:8px}
.acts.row{flex-direction:row}
button.go{appearance:none;border:0;height:54px;border-radius:8px;background:var(--ink);color:#fff;font-size:16px;font-weight:900;cursor:pointer}
button.go:disabled{background:#AEB4BF;cursor:not-allowed}
button.ghost{appearance:none;border:1.5px solid var(--line);background:#fff;height:50px;border-radius:8px;font-weight:700;cursor:pointer;color:var(--ink)}
.status-line{font-size:13px;color:var(--ink-2);min-height:1.4em;margin:0}
.err{color:var(--absent)}

.gate{position:fixed;inset:0;z-index:90;background:var(--ink);display:none;align-items:center;justify-content:center;padding:24px}
.gate.on{display:flex}
.gatecard{width:100%;max-width:340px;background:var(--paper);border-radius:12px;padding:32px 26px 26px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
#gSignInBtn{display:flex;justify-content:center;min-height:44px}
.step{display:none;flex-direction:column;gap:16px}
.step.on{display:flex}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
</style>
</head>
<body>

<section class="gate on" id="gate">
  <div class="gatecard">
    <div><h1 style="margin:0;font-size:26px;font-weight:900">學生人臉註冊</h1><p style="margin:6px 0 0;color:var(--ink-2);font-size:13px">請用你的 Google（學校）帳號登入，系統會自動核對你的身份</p></div>
    <div id="gSignInBtn"></div>
    <p class="status-line err" id="gateErr" role="alert" aria-live="polite"></p>
  </div>
</section>

<div class="wrap" id="app" style="display:none">
  <div class="brand"><h1>學生人臉註冊</h1><p>點名系統・臉部特徵註冊</p></div>
  <div class="whoami"><span id="whoamiText"></span><button type="button" id="signOutBtn">登出</button></div>

  <div class="card step on" id="step1">
    <h2>① 確認身份</h2>
    <div id="step1Teacher" style="display:none">
      <p class="hint">你是老師帳號，請選擇要協助註冊的班級</p>
      <div class="classes" id="classes"><span class="hint">讀取班級中…</span></div>
      <div class="field" id="studentField" style="display:none;margin-top:12px">
        <label for="studentSel">選擇座號姓名</label>
        <select class="inp" id="studentSel"></select>
      </div>
    </div>
    <div id="step1Student" style="display:none">
      <p class="hint">系統已經核對你登入的帳號，對應到：</p>
      <div class="whocard" id="studentConfirmText"></div>
    </div>
    <div id="reregWarn" class="reregwarn" style="display:none">
      <p class="hint" id="reregText" style="margin:0;color:#8A5A00"></p>
      <label class="agreerow"><input type="checkbox" id="reregConfirm">
        <span>我了解，確定要覆蓋重新註冊（原本的同意書紀錄仍會完整保留備查，只是比對用的臉部特徵資料會換成這次新拍攝的）。</span>
      </label>
    </div>
    <button class="go" id="step1Next" disabled>下一步：同意書</button>
    <p class="status-line" id="status1"></p>
  </div>

  <div class="card step" id="step2">
    <h2>② 閱讀並簽署同意書</h2>
    <div class="consentbox" id="consentText"></div>
    <label class="agreerow"><input type="checkbox" id="agree">
      <span>我已詳細閱讀並瞭解上述說明，同意學校蒐集、處理及利用臉部特徵資料，用於課堂點名辨識。</span>
    </label>
    <div class="row2">
      <div class="field"><label for="signName">簽署人姓名</label><input class="inp" id="signName" autocomplete="off"></div>
      <div class="field"><label for="signRole">簽署人身份</label>
        <select class="inp" id="signRole">
          <option value="學生本人">學生本人</option>
          <option value="家長或監護人">家長或監護人</option>
        </select>
      </div>
    </div>
    <div class="acts">
      <button class="go" id="step2Next">下一步：臉部掃描</button>
      <button class="ghost" id="step2Back">上一步</button>
    </div>
  </div>

  <div class="card step" id="step3">
    <h2>③ 臉部掃描</h2>
    <p class="hint">請找光線充足的地方正對鏡頭，系統會自動連續拍攝 4 張、每拍到一張會提示下一個角度，不用按任何拍照按鈕。</p>
    <div class="cam" id="camBox"><video id="video" playsinline muted autoplay></video>
      <svg class="camguide" viewBox="0 0 100 100" preserveAspectRatio="none"><ellipse cx="50" cy="48" rx="25" ry="40"/></svg>
    </div>
    <p class="hint" id="camHint">準備中…</p>
    <div class="dots" id="dots"></div>
    <div class="acts row">
      <button class="ghost" id="rescan" style="flex:1">重新掃描</button>
      <button class="ghost" id="step3Back" style="flex:1">上一步</button>
    </div>
    <p class="status-line" id="status3"></p>
  </div>

  <div class="card step" id="stepDone">
    <h2>🎉 註冊完成</h2>
    <p id="doneMsg"></p>
    <div class="acts" id="doneActs"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(function(){
'use strict';
var $=function(id){ return document.getElementById(id); };

/* ====================================================================
 * 請填入跟 Code.gs 同一個 GOOGLE_CLIENT_ID（Google Cloud Console 申請的
 * OAuth 用戶端 ID，結尾是 .apps.googleusercontent.com），以及跟 index.html
 * 同一支 Apps Script 部署後的 /exec 網址。兩邊沒填之前，登入跟送出都無法使用。
 * ==================================================================== */
var API_URL = 'PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE';
var GOOGLE_CLIENT_ID = 'PASTE_YOUR_GOOGLE_OAUTH_CLIENT_ID_HERE.apps.googleusercontent.com';
var IS_DEMO = !API_URL || API_URL.indexOf('PASTE_YOUR_APPS_SCRIPT_EXEC_URL_HERE') >= 0;

var FACE_LIB_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/dist/face-api.min.js';
var FACE_MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.15/model';
var faceLibPromise=null, faceReady=false, faceModelsPromise=null;
function loadFaceApiLib(){
  if(faceLibPromise) return faceLibPromise;
  faceLibPromise=new Promise(function(resolve,reject){
    if(typeof faceapi!=='undefined') return resolve();
    var s=document.createElement('script'); s.src=FACE_LIB_URL;
    s.onload=function(){ resolve(); };
    s.onerror=function(){ faceLibPromise=null; reject(new Error('人臉辨識函式庫載入失敗，請確認網路連線')); };
    document.head.appendChild(s);
  });
  return faceLibPromise;
}
function ensureFaceModels(){
  if(faceReady) return Promise.resolve();
  if(faceModelsPromise) return faceModelsPromise;
  faceModelsPromise=loadFaceApiLib().then(function(){
    return Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(FACE_MODEL_URL),
      faceapi.nets.faceRecognitionNet.loadFromUri(FACE_MODEL_URL)
    ]);
  }).then(function(){ faceReady=true; }).catch(function(e){ faceModelsPromise=null; throw e; });
  return faceModelsPromise;
}

var CONSENT_VERSION = 'v1';
var CONSENT_TEXT =
'【表演藝術課-臉部辨識授權同意書】\n\n'+
'為提升課堂點名效率，授課教師擬於課堂點名時，透過鏡頭拍攝影像並即時擷取臉部特徵數值（不會儲存完整照片，只會儲存無法還原成影像的一組數字），用來自動比對出席學生身份。\n\n'+
'1. 蒐集目的：課堂出缺勤點名紀錄之建立與查核。\n'+
'2. 蒐集項目：臉部特徵數值（並非照片本身）、班級、座號、姓名、註冊時間、登入帳號。\n'+
'3. 利用期間：自完成註冊之日起，至畢業／轉出班級，或本人（未成年由法定代理人）申請停用為止。\n'+
'4. 利用對象：僅授課教師本人於點名系統中比對使用，不會提供第三人，也不會公開或用於其他用途。\n'+
'5. 保管方式：以文字型態存放於學校內部試算表，非授課教師無法存取。\n'+
'6. 您的權利：得隨時要求查詢、複製、停止蒐集或刪除已註冊的特徵資料，請洽授課教師；教師端亦可隨時將您的資料設為停用。\n'+
'7. 本同意屬自願性質；不同意或事後撤回，均不影響原有課堂點名方式（教師仍會用其他方式為您點名），不會有任何不利處分。\n\n'+
'若您已年滿 18 歲，請由本人親自閱讀並簽署；若未滿 18 歲，請由家長或法定代理人閱讀並簽署本同意書。';

function pad(n){ return (n<10?'0':'')+n; }
var toastT;
function toast(msg,ms){ var t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on');}, ms||2600); }

var ID_TOKEN='', IDENTITY=null;
function buildBody_(action, args){
  switch(action){
    case 'regIdentify': return {action:'regIdentify'};
    case 'regClasses':  return {action:'regClasses'};
    case 'regRoster':   return {action:'regRoster', sheet:args[0]};
    case 'faceEnroll':  return {action:'faceEnroll', sheet:args[0].sheet, row:args[0].row, seat:args[0].seat, name:args[0].name, descriptors:args[0].descriptors, consent:args[0].consent, source:args[0].source};
  }
}
var DemoNames='伍少宇 朱維軒 余朔廷 吳宇軒 李翔方 孔令延 林子皓 林君謙'.split(' ');
function call(action){
  var args=Array.prototype.slice.call(arguments,1);
  if(IS_DEMO){
    if(action==='regIdentify') return Promise.resolve({role:'teacher', email:'demo@example.com'});
    if(action==='regClasses') return Promise.resolve([{sheet:'311',label:'311C',count:8}]);
    if(action==='regRoster') return Promise.resolve({sheet:args[0], students:DemoNames.map(function(n,i){return {seat:i+1,name:n,row:i+3};})});
    if(action==='faceEnroll') return Promise.resolve({ok:true, seat:args[0].seat, name:args[0].name, count:(args[0].descriptors||[]).length});
    return Promise.reject(new Error('示範模式尚未支援：'+action));
  }
  var body=buildBody_(action,args); body.idToken=ID_TOKEN;
  return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)})
    .then(function(r){ return r.text(); })
    .then(function(t){
      var j; try{ j=JSON.parse(t); } catch(e){ throw new Error('後端回應不是 JSON：'+t.slice(0,120)); }
      if(!j.ok){ var err=new Error(j.error||'未知的後端錯誤'); err.code=j.code; throw err; }
      return j.data;
    })
    .catch(function(err){
      if(err instanceof TypeError) throw new Error('連不上後端，請確認網路連線與 API_URL 是否正確（'+err.message+'）');
      throw err;
    });
}

var Reg={ classes:[], sheet:null, students:[], student:null, signName:'', signRole:'學生本人', stream:null, descriptors:[], captured:0, needed:4 };
var HINTS=['請正臉看鏡頭','請將臉稍微轉向左邊','請將臉稍微轉向右邊','請正臉看鏡頭（最後一張）'];

function showStep(n){
  ['step1','step2','step3','stepDone'].forEach(function(id,i){ $(id).classList.toggle('on', i+1===n); });
}

/* ---------- ① 身份確認：老師走班級／座號挑選，學生直接由登入帳號比對出來 ---------- */
function updateReregWarn(){
  var at = Reg.student && Reg.student.registeredAt;
  if(at){
    $('reregWarn').style.display='';
    $('reregText').textContent='⚠️ 這位同學已經在 '+at+' 完成過人臉註冊，重新註冊會覆蓋原本比對用的臉部特徵資料。';
    $('reregConfirm').checked=false;
  } else {
    $('reregWarn').style.display='none';
    $('reregConfirm').checked=false;
  }
  updateStep1NextEnabled();
}
function updateStep1NextEnabled(){
  var needsConfirm = Reg.student && Reg.student.registeredAt;
  $('step1Next').disabled = !Reg.student || (needsConfirm && !$('reregConfirm').checked);
}
$('reregConfirm').onchange=updateStep1NextEnabled;

function renderClasses(){
  var box=$('classes'); box.innerHTML='';
  if(!Reg.classes.length){ box.innerHTML='<span class="hint">找不到班級。</span>'; return; }
  Reg.classes.forEach(function(c){
    var b=document.createElement('button'); b.type='button'; b.className='cls';
    b.setAttribute('aria-pressed', c.sheet===Reg.sheet?'true':'false');
    b.innerHTML='<b></b><span></span>';
    b.firstChild.textContent=c.sheet; b.lastChild.textContent=c.count+' 人';
    b.title=c.label;
    b.onclick=function(){
      Reg.sheet=c.sheet; Reg.student=null; updateReregWarn();
      renderClasses(); $('studentField').style.display='none'; $('status1').textContent='讀取名單中…';
      call('regRoster', c.sheet).then(function(r){
        Reg.students=r.students||[];
        var sel=$('studentSel'); sel.innerHTML='<option value="">請選擇…</option>';
        Reg.students.forEach(function(st){ var o=document.createElement('option'); o.value=st.seat; o.textContent=pad(st.seat)+' '+st.name+(st.registeredAt?'（已註冊）':''); sel.appendChild(o); });
        $('studentField').style.display=''; $('status1').textContent='';
      }).catch(function(e){ $('status1').textContent='讀取名單失敗：'+(e&&e.message||e); });
    };
    box.appendChild(b);
  });
}
$('studentSel').onchange=function(){
  var seat=+this.value;
  Reg.student=Reg.students.filter(function(st){ return st.seat===seat; })[0]||null;
  updateReregWarn();
};
/* 手機瀏覽器（尤其 iOS Safari）規定 speechSynthesis.speak() 一定要在使用者點擊當下
   同步呼叫過一次，之後才允許在非同步流程（例如拍照偵測完成後）裡繼續發聲，
   不然即使呼叫了 speak() 也會完全沒有聲音、不會報錯。這裡在幾個真正的按鈕點擊事件裡
   先同步呼叫一次（音量設 0，使用者感覺不到），把語音權限「解鎖」給後面的流程用。 */
var speechUnlocked=false;
function unlockSpeech(){
  if(speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked=true;
  try{
    var u=new SpeechSynthesisUtterance(' ');
    u.volume=0; u.lang='zh-TW';
    speechSynthesis.speak(u);
  }catch(e){}
}

$('step1Next').onclick=function(){ if(!$('step1Next').disabled && Reg.student){ unlockSpeech(); $('consentText').textContent=CONSENT_TEXT; showStep(2); } };

function afterLogin(identity){
  IDENTITY=identity;
  $('whoamiText').textContent = identity.role==='teacher' ? ('👩‍🏫 老師身份：'+identity.email) : ('🙋 '+identity.email);
  if(identity.role==='teacher'){
    $('step1Teacher').style.display=''; $('step1Student').style.display='none';
    Reg.sheet=null; Reg.student=null; updateReregWarn();
    $('classes').innerHTML='<span class="hint">讀取班級中…</span>';
    call('regClasses').then(function(list){ Reg.classes=list||[]; renderClasses(); })
      .catch(function(e){ $('classes').innerHTML=''; $('status1').textContent='讀取班級失敗：'+(e&&e.message||e); });
  } else {
    $('step1Teacher').style.display='none'; $('step1Student').style.display='';
    Reg.sheet=identity.sheet; Reg.student={seat:identity.seat, name:identity.name, row:identity.row, registeredAt:identity.registeredAt||null};
    $('studentConfirmText').textContent = identity.sheet+' 班　'+pad(identity.seat)+' 號　'+identity.name;
    updateReregWarn();
  }
  showStep(1);
  $('gate').classList.remove('on'); $('app').style.display='';
}

/* ---------- ② 同意書 ---------- */
$('step2Back').onclick=function(){ showStep(1); };
$('step2Next').onclick=function(){
  if(!$('agree').checked){ toast('請先勾選同意才能繼續'); return; }
  var nm=$('signName').value.trim();
  if(!nm){ toast('請輸入簽署人姓名'); return; }
  Reg.signName=nm; Reg.signRole=$('signRole').value;
  unlockSpeech();
  enterStep3();
};

/* ---------- ③ 臉部掃描：自動連拍，不用手動按快門 ---------- */
var regCapturing=false, regCaptureRAF=null, regBusyDetect=false, regStableCount=0, regLastTick=0;
var CAPTURE_STABLE_FRAMES=4, CAPTURE_INTERVAL=380, CAPTURE_PAUSE_MS=2600;
// 引導框：水平置中的橢圓形，寬高是鏡頭畫面的比例（不是像素），所以不同裝置的鏡頭畫面都適用。
var GUIDE={ wPct:0.50, hPct:0.80, yPct:0.08 };
var GUIDE_SIZE_MIN=0.66, GUIDE_SIZE_MAX=1.42; // 臉框寬度 ÷ 引導框寬度，超出這個範圍視為太遠／太近
var GUIDE_CENTER_TOL=0.32;                    // 臉框中心偏離引導框中心的容許比例
var GUIDE_SCORE_MIN=0.72;                     // 偵測信心值門檻，太低視為可能有遮蔽物或光線不足
var GUIDE_ASPECT_MIN=0.58, GUIDE_ASPECT_MAX=1.05; // 臉框寬高比，超出範圍視為角度異常／疑似遮蔽

function renderDots(){
  var box=$('dots'); box.innerHTML='';
  for(var i=0;i<Reg.needed;i++){ var d=document.createElement('i'); if(i<Reg.captured) d.className='on'; box.appendChild(d); }
}
function openCamera(){
  stopCamera();
  return navigator.mediaDevices.getUserMedia({video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false})
    .then(function(s){ Reg.stream=s; $('video').srcObject=s; return $('video').play(); });
}
function stopCamera(){ if(Reg.stream){ Reg.stream.getTracks().forEach(function(t){t.stop();}); Reg.stream=null; } }
function flashCam(){ var b=$('camBox'); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash'); }

/* 語音指引：用瀏覽器內建的 Web Speech API 念出來，不用額外的語音檔或函式庫。
   同一句話不會連續重複念，避免一直碎念；不支援語音合成的瀏覽器就單純沒有聲音，畫面上的文字提示還是有。 */
var lastSpoken='';
function speak(text){
  try{
    if(!('speechSynthesis' in window) || !text) return;
    if(lastSpoken===text) return;
    lastSpoken=text;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text); u.lang='zh-TW'; u.rate=1; u.pitch=1;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* 用臉框跟引導框的相對關係，判斷「太遠／太近／沒置中／可能遮蔽／背景有其他人」。
   這是用偵測信心值＋框的大小比例／寬高比做的估算，不是真的辨識「有沒有戴口罩」這種語意層級的判斷，
   遇到極端情況（例如只遮住半張臉、戴很服貼的透明口罩）不一定抓得到，但已經能擋掉大部分常見狀況。 */
function evalGuide(faces, vw, vh){
  var guideW=GUIDE.wPct*vw, guideH=GUIDE.hPct*vh;
  var guideCx=vw/2, guideCy=(GUIDE.yPct+GUIDE.hPct/2)*vh;
  if(!faces.length) return {ok:false, msg:'沒有偵測到臉，請將臉對準框內', voice:'請將臉對準框框中央'};
  if(faces.length>1) return {ok:false, msg:'偵測到背景有其他人，請確保畫面中只有你自己', voice:'畫面中出現其他人，請確認只有你自己入鏡'};
  var box=faces[0].detection.box, score=faces[0].detection.score;
  if(score<GUIDE_SCORE_MIN) return {ok:false, msg:'偵測不夠清楚，請確認臉部沒有被口罩、瀏海或手部遮住', voice:'臉部可能被遮住，請移開遮蔽物'};
  var aspect=box.width/box.height;
  if(aspect<GUIDE_ASPECT_MIN || aspect>GUIDE_ASPECT_MAX) return {ok:false, msg:'偵測到臉部角度異常，請正對鏡頭、確認臉部完整入鏡', voice:'請正對鏡頭，確認臉部完整入鏡'};
  var sizeRatio=box.width/guideW;
  if(sizeRatio<GUIDE_SIZE_MIN) return {ok:false, msg:'距離太遠，請靠近鏡頭一點，讓臉部符合框框大小', voice:'請再靠近鏡頭一點'};
  if(sizeRatio>GUIDE_SIZE_MAX) return {ok:false, msg:'距離太近，請離鏡頭遠一點', voice:'請離鏡頭遠一點'};
  var cx=box.x+box.width/2, cy=box.y+box.height/2;
  var dx=Math.abs(cx-guideCx)/guideW, dy=Math.abs(cy-guideCy)/guideH;
  if(dx>GUIDE_CENTER_TOL || dy>GUIDE_CENTER_TOL) return {ok:false, msg:'請將臉對準框內置中', voice:'請將臉對準框框置中'};
  return {ok:true, msg:'', voice:''};
}

function enterStep3(){
  Reg.descriptors=[]; Reg.captured=0; renderDots(); lastSpoken='';
  $('camHint').textContent='準備鏡頭中…'; $('status3').textContent='';
  showStep(3);
  openCamera().then(function(){
    $('camHint').textContent='載入辨識模型中…（第一次使用會慢一點）';
    return ensureFaceModels();
  }).then(function(){
    $('camHint').textContent=HINTS[0];
    $('status3').textContent='請放輕鬆表情，眼睛看著鏡頭，不用做誇張表情';
    speak('請將臉對準框框，表情放輕鬆，眼睛看著鏡頭');
    startAutoCapture();
  }).catch(function(e){ $('camHint').textContent='初始化失敗'; $('status3').textContent=(e&&e.message||e); });
}
function startAutoCapture(){ regCapturing=true; regStableCount=0; regLastTick=0; regCaptureRAF=requestAnimationFrame(captureTick); }
function stopAutoCapture(){ regCapturing=false; if(regCaptureRAF) cancelAnimationFrame(regCaptureRAF); }
function captureTick(t){
  if(!regCapturing) return;
  regCaptureRAF=requestAnimationFrame(captureTick);
  if(regBusyDetect || t-regLastTick<CAPTURE_INTERVAL) return;
  regLastTick=t; regBusyDetect=true;
  var vw=$('video').videoWidth, vh=$('video').videoHeight;
  if(!vw||!vh){ regBusyDetect=false; return; }
  faceapi.detectAllFaces($('video'), new faceapi.TinyFaceDetectorOptions({inputSize:256, scoreThreshold:0.4}))
    .withFaceLandmarks().withFaceDescriptors()
    .then(function(faces){
      regBusyDetect=false;
      var g=evalGuide(faces, vw, vh);
      $('camBox').classList.toggle('guide-ok', g.ok);
      $('camBox').classList.toggle('guide-bad', !g.ok);
      if(!g.ok){ regStableCount=0; $('status3').textContent=g.msg; speak(g.voice); return; }
      regStableCount++;
      $('status3').textContent = regStableCount<CAPTURE_STABLE_FRAMES ? '位置很好，保持不動…' : '';
      if(regStableCount<CAPTURE_STABLE_FRAMES) return;
      regStableCount=0;
      Reg.descriptors.push(Array.prototype.slice.call(faces[0].descriptor));
      Reg.captured++; renderDots(); flashCam();
      if(Reg.captured>=Reg.needed){
        stopAutoCapture();
        $('camHint').textContent='拍攝完成，送出註冊中…'; $('camBox').classList.remove('guide-ok','guide-bad');
        speak('拍攝完成');
        submitEnroll();
      } else {
        // 拍完一張後先暫停偵測一段時間，給學生時間轉頭調整角度，
        // 不然原本偵測是持續在跑，臉一穩定下來馬上就會拍下一張，根本來不及轉頭。
        stopAutoCapture();
        $('camHint').textContent=HINTS[Reg.captured];
        $('status3').textContent='請依提示調整角度，'+(CAPTURE_PAUSE_MS/1000)+' 秒後自動繼續拍攝…';
        $('camBox').classList.remove('guide-ok','guide-bad');
        lastSpoken=''; speak(HINTS[Reg.captured]);
        setTimeout(function(){
          $('status3').textContent='';
          startAutoCapture();
        }, CAPTURE_PAUSE_MS);
      }
    }).catch(function(){ regBusyDetect=false; });
}
$('rescan').onclick=function(){ stopAutoCapture(); enterStep3(); };
$('step3Back').onclick=function(){ stopAutoCapture(); stopCamera(); try{speechSynthesis.cancel();}catch(e){} showStep(2); };

function submitEnroll(){
  call('faceEnroll', {
    sheet:Reg.sheet, row:Reg.student.row, seat:Reg.student.seat, name:Reg.student.name,
    descriptors:Reg.descriptors, consent:{name:Reg.signName, role:Reg.signRole, version:CONSENT_VERSION},
    source: (IDENTITY && IDENTITY.role==='teacher') ? 'teacher' : 'self'
  }).then(function(r){
    stopCamera();
    $('doneMsg').textContent=pad(r.seat)+' '+r.name+' 已完成人臉註冊，之後老師開啟人臉辨識點名時就可以直接被認出來了。';
    renderDoneActs();
    showStep(4);
  }).catch(function(e){
    $('camHint').textContent='送出失敗，請按下方重新掃描再試一次';
    $('status3').textContent=(e&&e.message||e);
  });
}

/* ---------- 完成畫面：老師可以連續幫下一位註冊，學生就結束 ---------- */
function renderDoneActs(){
  var box=$('doneActs'); box.innerHTML='';
  if(IDENTITY && IDENTITY.role==='teacher'){
    var b=document.createElement('button'); b.type='button'; b.className='go'; b.textContent='再幫另一位同學註冊';
    b.onclick=function(){ Reg.student=null; $('studentSel').value=''; updateReregWarn(); showStep(1); };
    box.appendChild(b);
  } else {
    var p=document.createElement('p'); p.className='hint'; p.textContent='可以直接關閉這個分頁了。';
    box.appendChild(p);
  }
}

/* ---------- Google 登入 ---------- */
function handleCredential(response){
  $('gateErr').textContent='驗證中…';
  ID_TOKEN=response.credential;
  call('regIdentify').then(function(identity){
    afterLogin(identity);
  }).catch(function(e){
    ID_TOKEN='';
    $('gateErr').textContent='登入驗證失敗：'+(e&&e.message||e);
  });
}
$('signOutBtn').onclick=function(){
  stopAutoCapture(); stopCamera();
  ID_TOKEN=''; IDENTITY=null; Reg.sheet=null; Reg.student=null;
  try{ if(window.google&&google.accounts&&google.accounts.id) google.accounts.id.disableAutoSelect(); }catch(e){}
  $('app').style.display='none'; $('gate').classList.add('on'); $('gateErr').textContent='';
};

if(IS_DEMO){
  call('regIdentify').then(afterLogin);
} else {
  window.onload=function(){
    var tries=0;
    (function waitGsi(){
      if(window.google && google.accounts && google.accounts.id){
        google.accounts.id.initialize({
          client_id: GOOGLE_CLIENT_ID,
          callback: handleCredential,
          auto_select: true,        // 瀏覽器本來就登入著 Google、且之前同意過的話，會自動選那個帳號完成登入，不用手動點
          cancel_on_tap_outside: false
        });
        google.accounts.id.renderButton($('gSignInBtn'), { theme:'outline', size:'large', text:'signin_with', shape:'pill', locale:'zh_TW' });
        // 嘗試自動彈出 One Tap／自動選取登入；如果瀏覽器封鎖第三方 Cookie、使用者之前關掉過
        // One Tap、或同一瀏覽器登入多組帳號等情況會被跳過，這時上面手動的登入按鈕仍然可以用。
        try{ google.accounts.id.prompt(); }catch(e){}
        return;
      }
      if(++tries>100){ $('gateErr').textContent='Google 登入元件載入失敗，請確認網路連線後重新整理頁面'; return; }
      setTimeout(waitGsi,100);
    })();
  };
}
})();
</script>
